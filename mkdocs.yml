site_name: Luwa
site_url: https://rluwa.com/
site_description: Luwa, a Luau runner Discord bot. Run Luau in a real Roblox server straight from Discord.
theme:
  name: material
  favicon: images/favicon.png
  logo: images/favicon.png
  custom_dir: overrides
  features:
    - content.code.copy
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

repo_url: https://github.com/haotian2006/RluauRunnerV3
repo_name: haotian2006/RluauRunnerV3
copyright: Luau is a trademark of Roblox Corporation. Independent project; not affiliated with or endorsed by Roblox.

extra:
  generator: false
extra_css:
  - stylesheets/brand.css
nav:
  - Home: index.md
  - Commands: Commands.md
  - Environment:
      - Overview: Environment/index.md
      - discord: Environment/discord.md
      - etable: Environment/etable.md
      - io: Environment/io.md
      - misc: Environment/misc.md
      - Image: Environment/Image.md
      - lune: Environment/lune.md
  - Playground: playground.md
  - Tos: TOS.md
  - Privacy Policy: PrivacyPolicy.md
  - Changes: Changes.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
