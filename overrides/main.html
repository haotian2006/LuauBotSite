{% extends "base.html" %}

{% block extrahead %}
    {{ super() }}
    <meta property="og:type" content="website">
    <meta property="og:title" content="Luwa, a Luau runner Discord bot">
    <meta property="og:description" content="A Discord Bot that can compile and execute Luau code in Roblox's environment.">
    <meta property="og:url" content="https://rluwa.com/">
    <meta property="og:image" content="https://rluwa.com/images/favicon.png">
    <style>
        .luau-header-stats {
            margin-left: .65rem;
            font-size: .72rem;
            font-weight: 400;
            opacity: .78;
            white-space: nowrap;
        }

        @media screen and (max-width: 600px) {
            .luau-header-stats { display: none; }
        }

        body[data-md-color-scheme="slate"] .md-typeset table {
            color: var(--md-default-fg-color);
        }

        body[data-md-color-scheme="slate"] .md-typeset table code {
            color: var(--md-default-fg-color);
        }

        .md-header__source { order: 1; }
        .md-header__option[data-md-component="palette"] { order: 2; }
        .md-header__button[for="__search"],
        .md-header .md-search { order: 3; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const topic = document.querySelector('.md-header__topic');
            if (!topic) return;

            const statsLabel = document.createElement('span');
            statsLabel.className = 'luau-header-stats';
            statsLabel.textContent = '· 104 servers · 276k members';
            topic.appendChild(statsLabel);

            fetch('/stats')
                .then(response => response.ok ? response.json() : Promise.reject(response.status))
                .then(stats => {
                    const guilds = Number.isFinite(stats.guilds) ? stats.guilds.toLocaleString() : '104';
                    const members = Number.isFinite(stats.memberReach) ? stats.memberReach.toLocaleString() : '276,070';
                    statsLabel.textContent = `· ${guilds} servers · ${members} members`;
                })
                .catch(() => {});
        });
    </script>
{% endblock %}
