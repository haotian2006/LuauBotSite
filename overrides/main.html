{% extends "base.html" %}

{% block htmltitle %}
    {% if page and page.is_homepage %}
        <title>Luwa, a Luau runner Discord bot for Roblox</title>
    {% else %}
        {{ super() }}
    {% endif %}
{% endblock %}

{% block extrahead %}
    {{ super() }}
    <meta property="og:type" content="website">
    <meta property="og:title" content="Luwa, a Luau runner Discord bot">
    <meta property="og:description" content="{{ page.meta.description if page and page.meta and page.meta.description else config.site_description }}">
    <meta property="og:url" content="https://rluwa.com/">
    <meta property="og:image" content="https://rluwa.com/images/favicon.png">
    <script>
        // Anonymous page view count (see the Privacy Policy): the page's path and the domain of the
        // site that linked here. No cookies or identifiers. Skipped when the browser asks not to track.
        (function () {
            try {
                if (navigator.globalPrivacyControl || navigator.doNotTrack === "1") return;
                if (!/(^|\.)rluwa\.com$/.test(location.hostname) || !navigator.sendBeacon) return;
                var source = "";
                try { source = document.referrer ? new URL(document.referrer).hostname : ""; } catch (e) { }
                navigator.sendBeacon("https://api.rluwa.com/hit", JSON.stringify({ page: location.pathname, source: source }));
            } catch (e) { }
        })();
    </script>
    <style>
        .luau-header-stats {
            margin-left: .65rem;
            font-size: .72rem;
            font-weight: 400;
            opacity: .78;
            white-space: nowrap;
        }

        @media screen and (max-width: 600px) {
            .luau-header-stats { display: none; }
        }

        body[data-md-color-scheme="slate"] .md-typeset table {
            color: var(--md-default-fg-color);
        }

        body[data-md-color-scheme="slate"] .md-typeset table code {
            color: var(--md-default-fg-color);
        }

        .luwa-home-link {
            display: block;
            height: 100%;
            color: inherit;
        }

        .luwa-home-link:hover,
        .luwa-home-link:focus {
            color: inherit;
        }

        .md-header__source { order: 1; }
        .md-header__option[data-md-component="palette"] { order: 2; }
        .md-header__button[for="__search"],
        .md-header .md-search { order: 3; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // The title (site name, or the page name once scrolled) also goes home, like the logo.
            const title = document.querySelector('.md-header__title .md-header__ellipsis');
            const logo = document.querySelector('.md-header__button.md-logo');
            if (title && logo) {
                const homeLink = document.createElement('a');
                homeLink.className = 'luwa-home-link';
                homeLink.href = logo.href;
                homeLink.title = 'Luwa home';
                title.parentNode.insertBefore(homeLink, title);
                homeLink.appendChild(title);
            }

            const topic = document.querySelector('.md-header__topic');
            if (!topic) return;

            fetch('https://api.rluwa.com/stats')
                .then(response => response.ok ? response.json() : Promise.reject(response.status))
                .then(stats => {
                    if (!Number.isFinite(stats.guilds) || !Number.isFinite(stats.memberReach)) return;
                    const statsLabel = document.createElement('span');
                    statsLabel.className = 'luau-header-stats';
                    statsLabel.textContent = `${stats.guilds.toLocaleString()} servers ${stats.memberReach.toLocaleString()} members`;
                    topic.appendChild(statsLabel);
                })
                .catch(() => {});
        });
    </script>
{% endblock %}
